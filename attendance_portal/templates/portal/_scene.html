{% load static %}
<!-- 3D photo scene: the picture is split into depth layers (back wall, people, scanner) -->
<div class="scene" aria-hidden="true">
  <div class="photo-sway">
    <div class="photo-world">

      <div class="layer l-back">
        <img class="ph" src="{% static 'avsys_auth/img/lobby.jpg' %}" alt="">
        <i class="sheen"></i>
      </div>

      <div class="layer l-woman"><img class="ph" src="{% static 'avsys_auth/img/lobby-woman.webp' %}" alt=""></div>
      <div class="layer l-man"><img class="ph" src="{% static 'avsys_auth/img/lobby-man.webp' %}" alt=""></div>

      <div class="layer l-device">
        <img class="ph" src="{% static 'avsys_auth/img/lobby-device.webp' %}" alt="">
        <i class="screen-glow"></i>
        <i class="fp-glow"></i>
        <i class="fp-ring"></i>
        <div class="bubble"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2fe3a2"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Checked in</div>
      </div>

    </div>
  </div>
  <div class="veil"></div>
  <div class="sparks">
    <i class="sp" style="left:8%;animation-delay:0s;animation-duration:16s;--s:6px"></i>
    <i class="sp" style="left:22%;animation-delay:-6s;animation-duration:20s;--s:4px"></i>
    <i class="sp" style="left:37%;animation-delay:-11s;animation-duration:18s;--s:5px"></i>
    <i class="sp" style="left:55%;animation-delay:-3s;animation-duration:22s;--s:4px"></i>
    <i class="sp" style="left:68%;animation-delay:-9s;animation-duration:17s;--s:6px"></i>
    <i class="sp" style="left:80%;animation-delay:-14s;animation-duration:21s;--s:4px"></i>
    <i class="sp" style="left:93%;animation-delay:-5s;animation-duration:19s;--s:5px"></i>
  </div>
</div>
