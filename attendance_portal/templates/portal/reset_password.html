{% extends "portal/avsys_base.html" %}
{% block title %}New password{% endblock %}
{% block content %}
<h2>Set a new password</h2>
<p class="sub">OTP verified. Choose a new password.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "portal/_fields.html" %}
  <button class="btn" type="submit">Save new password</button>
</form>
{% endblock %}
