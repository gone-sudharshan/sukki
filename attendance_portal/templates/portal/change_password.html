{% extends "portal/avsys_base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h2>Change password</h2>
<p class="sub">Enter your current password, then a new one.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "portal/_fields.html" %}
  <button class="btn" type="submit">Change password</button>
</form>
<p class="links"><a href="{{ cancel_url }}">Cancel</a></p>
{% endblock %}
